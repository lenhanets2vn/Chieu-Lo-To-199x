# Render Blueprint: Static Site + Firebase (no continuously-running Node service)
services:
  - type: web
    name: loto-hoi-cho-199x
    runtime: static
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIRESTORE_DATABASE_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
